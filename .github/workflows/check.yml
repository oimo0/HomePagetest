name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check main.js
          node --check contour-flow.mjs
      - name: Test closed contour extraction and GPU texture layout
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { buildContourPaths, buildFlowTexture } from './contour-flow.mjs';
          const width=120,height=120,rgba=new Uint8Array(width*height*4);
          // A ring with a transparent hole plus a separate solid stroke:
          // exercises both outer and inner closed paths.
          for(let y=6;y<114;y++)for(let x=6;x<114;x++){
            const ring=x>12&&x<75&&y>14&&y<103&&!(x>30&&x<57&&y>40&&y<76);
            const stroke=x>84&&x<102&&y>30&&y<94;
            if(ring||stroke)rgba[(y*width+x)*4+3]=255;
          }
          const paths=buildContourPaths(rgba,width,height,2);
          assert.ok(paths.length>=4, 'need outer, inner and inset loops');
          assert.ok(paths.some(p=>p.inset>0),'inset/internal contour required');
          assert.ok(paths.every(p=>p.points.length>=16));
          const map=buildFlowTexture(paths,1024);
          assert.equal(map.textureHeight,map.tracks.length);
          assert.equal(map.pixels.length,map.textureWidth*map.textureHeight*4);
          assert.ok(map.tracks.every(t=>t.length>0 && t.length<=map.textureWidth));
          assert.ok(map.totalWeight>0);
          console.log('Contour loops:',paths.length,'texture:',map.textureWidth,'x',map.textureHeight);
          JS
      - name: Browser smoke test — WebGL particle logo
        run: |
          npm install --no-save --silent playwright-core@1.56.1
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/asro-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_BIN,
            args: ['--no-sandbox','--enable-unsafe-swiftshader','--use-angle=swiftshader']
          });
          try {
            const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'load'});
            await page.waitForFunction(() => document.getElementById('stage')?.classList.contains('particles-ready'),null,{timeout:25000});
            const info = await page.evaluate(() => ({
              width:document.getElementById('particles')?.width,
              height:document.getElementById('particles')?.height,
              scrollHeight:document.documentElement.scrollHeight
            }));
            assert.ok(info.width>0 && info.height>0);
            assert.ok(info.scrollHeight>844);
            await page.evaluate(() => window.scrollTo(0,document.getElementById('story').offsetHeight/2));
            await page.waitForTimeout(250);
            assert.equal(pageErrors.length,0,pageErrors.join('\n'));
            console.log('Mobile WebGL particle smoke test passed',info);
          } finally {
            await browser.close();
          }
          JS
      - name: Verify static assets and internal links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          root = Path('.')
          for f in ['index.html', 'main.js', 'style.css', 'assets/asro-logo.svg']:
              assert (root / f).exists(), f'Missing asset: {f}'
          ET.parse('assets/asro-logo.svg')
          class Links(HTMLParser):
              urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('src', 'href'):
                      if key in attrs:
                          self.urls.append(attrs[key])
          parser = Links()
          parser.feed((root / 'index.html').read_text())
          for link in parser.urls:
              if link.startswith('./'):
                  assert (root / link[2:]).exists(), f'Broken local link: {link}'
          print('All site assets, SVG and static references OK.')
          PY
